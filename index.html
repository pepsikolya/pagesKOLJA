<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Randomization</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --bg: #f5f5f7;
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(0, 0, 0, 0.08);
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --accent: #0071e3;
            --accent-hover: #0077ed;
            --radius-lg: 20px;
            --radius-md: 12px;
            --radius-sm: 8px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #000000;
                --card-bg: rgba(28, 28, 30, 0.85);
                --card-border: rgba(255, 255, 255, 0.12);
                --text-primary: #f5f5f7;
                --text-secondary: #86868b;
                --accent: #2997ff;
                --accent-hover: #3b9eff;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        .window {
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 480px;
            padding: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Top Segmented Picker */
        .tab-picker {
            display: flex;
            background: rgba(0, 0, 0, 0.04);
            border-radius: var(--radius-md);
            padding: 3px;
        }

        @media (prefers-color-scheme: dark) {
            .tab-picker {
                background: rgba(255, 255, 255, 0.08);
            }
        }

        .tab-btn {
            flex: 1;
            padding: 8px 0;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: var(--card-bg);
            color: var(--text-primary);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        /* Controls Grid */
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .control-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        select, input[type="number"] {
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            padding: 10px 12px;
            border-radius: var(--radius-md);
            border: 1px solid var(--card-border);
            background-color: rgba(0, 0, 0, 0.02);
            color: var(--text-primary);
            outline: none;
            appearance: none;
            transition: all 0.2s ease;
        }

        select:focus, input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.15);
        }

        /* 3D Canvas Stage */
        #canvas-stage {
            width: 100%;
            height: 200px;
            border-radius: var(--radius-md);
            background: rgba(0, 0, 0, 0.02);
            border: 1px solid var(--card-border);
            overflow: hidden;
            position: relative;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Action Button */
        button.primary-btn {
            font-family: inherit;
            font-size: 15px;
            font-weight: 500;
            background-color: var(--accent);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-md);
            padding: 12px 20px;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        button.primary-btn:hover {
            background-color: var(--accent-hover);
        }

        button.primary-btn:active {
            transform: scale(0.98);
        }

        /* Results Board */
        .score-board {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: rgba(0, 0, 0, 0.02);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            padding: 16px 20px;
        }

        .score-item {
            display: flex;
            flex-direction: column;
        }

        .score-value {
            font-size: 26px;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .score-label {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        /* History Log Drawer */
        .history-list {
            max-height: 100px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .history-entry {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            padding: 6px 10px;
            background-color: rgba(0, 0, 0, 0.02);
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
        }

        .history-entry strong {
            color: var(--text-primary);
        }
    </style>
</head>
<body>

    <div class="window">
        <!-- Game Switcher Tab -->
        <div class="tab-picker">
            <button id="tab-dice" class="tab-btn active" onclick="switchGame('dice')">🎲 Kostky 3D</button>
            <button id="tab-coin" class="tab-btn" onclick="switchGame('coin')">🪙 Mince 3D</button>
        </div>

        <!-- Dice Mode Controls -->
        <div id="dice-controls" class="controls">
            <div class="control-item">
                <label for="dice-count">Počet</label>
                <select id="dice-count" onchange="setup3DStage()">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                </select>
            </div>
            <div class="control-item">
                <label for="dice-color">Barva</label>
                <select id="dice-color" onchange="setup3DStage()">
                    <option value="0xffffff">Bílá</option>
                    <option value="0x1d1d1f">Tmavá</option>
                    <option value="0x0071e3">Modrá</option>
                </select>
            </div>
            <div class="control-item">
                <label for="modifier">Bonus (+/-)</label>
                <input type="number" id="modifier" value="0" step="1" onchange="updateScoreDisplay()">
            </div>
        </div>

        <!-- Coin Mode Controls -->
        <div id="coin-controls" class="controls" style="display: none; grid-template-columns: 1fr;">
            <div class="control-item">
                <label for="coin-type">Typ Mince</label>
                <select id="coin-type" onchange="setup3DStage()">
                    <option value="gold">Zlatá Koruna</option>
                    <option value="silver">Stříbrná Mince</option>
                </select>
            </div>
        </div>

        <!-- Interactive 3D Canvas Stage -->
        <div id="canvas-stage"></div>

        <button id="action-btn" class="primary-btn" onclick="triggerAction()">Hodit kostkou</button>

        <!-- Dynamic Results Panel -->
        <div class="score-board">
            <div class="score-item">
                <span id="result-val" class="score-value">-</span>
                <span id="result-lbl" class="score-label">Výsledek</span>
            </div>
            <div class="score-item" style="text-align: right;">
                <span id="action-count" class="score-value" style="font-size: 18px; color: var(--text-secondary);">0</span>
                <span id="action-lbl" class="score-label">Hody</span>
            </div>
        </div>

        <!-- History -->
        <div id="history-list" class="history-list"></div>
    </div>

    <script>
        let currentGame = 'dice';
        let rollCounter = 0;
        let lastRawResult = 0;
        let isAnimating = false;

        // Three.js Scene Variables
        let scene, camera, renderer, objects = [];
        const canvasStage = document.getElementById('canvas-stage');

        // Audio Context
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playBounceSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = currentGame === 'dice' ? 'sine' : 'triangle';
            osc.frequency.setValueAtTime(currentGame === 'dice' ? 220 : 600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.1);

            gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        function initThree() {
            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(45, canvasStage.clientWidth / canvasStage.clientHeight, 0.1, 100);
            camera.position.set(0, 0, 7);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(canvasStage.clientWidth, canvasStage.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            canvasStage.appendChild(renderer.domElement);

            // Lighting Setup
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(5, 10, 7);
            scene.add(dirLight);

            setup3DStage();
            animate();
        }

        // Texture generators for realistic 3D Dice faces
        function createDiceTextures(baseColorHex) {
            const textures = [];
            const pipPositions = {
                1: [[0.5, 0.5]],
                2: [[0.25, 0.25], [0.75, 0.75]],
                3: [[0.25, 0.25], [0.5, 0.5], [0.75, 0.75]],
                4: [[0.25, 0.25], [0.75, 0.25], [0.25, 0.75], [0.75, 0.75]],
                5: [[0.25, 0.25], [0.75, 0.25], [0.5, 0.5], [0.25, 0.75], [0.75, 0.75]],
                6: [[0.25, 0.25], [0.75, 0.25], [0.25, 0.5], [0.75, 0.5], [0.25, 0.75], [0.75, 0.75]]
            };

            for (let i = 1; i <= 6; i++) {
                const canvas = document.createElement('canvas');
                canvas.width = 256;
                canvas.height = 256;
                const ctx = canvas.getContext('2d');

                // Card background
                ctx.fillStyle = baseColorHex;
                ctx.fillRect(0, 0, 256, 256);

                // Border outline
                ctx.strokeStyle = 'rgba(0,0,0,0.08)';
                ctx.lineWidth = 8;
                ctx.strokeRect(0, 0, 256, 256);

                // Draw pips
                ctx.fillStyle = baseColorHex === '#1d1d1f' ? '#ffffff' : '#1d1d1f';
                pipPositions[i].forEach(([x, y]) => {
                    ctx.beginPath();
                    ctx.arc(x * 256, y * 256, 18, 0, Math.PI * 2);
                    ctx.fill();
                });

                textures.push(new THREE.CanvasTexture(canvas));
            }
            return textures;
        }

        function createCoinTexture(label) {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = document.getElementById('coin-type').value === 'gold' ? '#eab308' : '#94a3b8';
            ctx.fillRect(0, 0, 256, 256);

            ctx.strokeStyle = 'rgba(0,0,0,0.15)';
            ctx.lineWidth = 12;
            ctx.beginPath();
            ctx.arc(128, 128, 110, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = '#1d1d1f';
            ctx.font = 'bold 80px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(label, 128, 128);

            return new THREE.CanvasTexture(canvas);
        }

        function setup3DStage() {
            // Clear existing objects
            objects.forEach(obj => scene.remove(obj));
            objects = [];

            if (currentGame === 'dice') {
                const count = parseInt(document.getElementById('dice-count').value, 10);
                const colorHex = document.getElementById('dice-color').value;
                const hexStr = '#' + parseInt(colorHex).toString(16).padStart(6, '0');
                const textures = createDiceTextures(hexStr);

                const materials = [
                    new THREE.MeshStandardMaterial({ map: textures[0] }), // Right: 1
                    new THREE.MeshStandardMaterial({ map: textures[5] }), // Left: 6
                    new THREE.MeshStandardMaterial({ map: textures[1] }), // Top: 2
                    new THREE.MeshStandardMaterial({ map: textures[4] }), // Bottom: 5
                    new THREE.MeshStandardMaterial({ map: textures[2] }), // Front: 3
                    new THREE.MeshStandardMaterial({ map: textures[3] })  // Back: 4
                ];

                const geometry = new THREE.BoxGeometry(1.2, 1.2, 1.2);

                const offsets = count === 1 ? [0] : count === 2 ? [-0.9, 0.9] : [-1.5, 0, 1.5];

                for (let i = 0; i < count; i++) {
                    const cube = new THREE.Mesh(geometry, materials);
                    cube.position.x = offsets[i];
                    scene.add(cube);
                    objects.push(cube);
                }
            } else {
                // Coin mode
                const headsTex = createCoinTexture('H');
                const tailsTex = createCoinTexture('O');

                const materials = [
                    new THREE.MeshStandardMaterial({ color: 0xc0c0c0 }), // Edge
                    new THREE.MeshStandardMaterial({ map: headsTex }),   // Front
                    new THREE.MeshStandardMaterial({ map: tailsTex })    // Back
                ];

                const geometry = new THREE.CylinderGeometry(1.2, 1.2, 0.15, 32);
                const coin = new THREE.Mesh(geometry, materials);
                coin.rotation.x = Math.PI / 2;
                scene.add(coin);
                objects.push(coin);
            }
        }

        function triggerAction() {
            if (isAnimating) return;
            isAnimating = true;
            playBounceSound();

            rollCounter++;

            if (currentGame === 'dice') {
                let totalSum = 0;
                let results = [];

                // Face rotations map for D6
                const targetRotations = {
                    1: { x: 0, y: -Math.PI / 2 },
                    6: { x: 0, y: Math.PI / 2 },
                    2: { x: -Math.PI / 2, y: 0 },
                    5: { x: Math.PI / 2, y: 0 },
                    3: { x: 0, y: 0 },
                    4: { x: 0, y: Math.PI }
                };

                objects.forEach((cube) => {
                    const val = Math.floor(Math.random() * 6) + 1;
                    totalSum += val;
                    results.push(val);

                    const target = targetRotations[val];
                    const spinsX = (Math.floor(Math.random() * 2) + 2) * Math.PI * 2;
                    const spinsY = (Math.floor(Math.random() * 2) + 2) * Math.PI * 2;

                    const startRotX = cube.rotation.x;
                    const startRotY = cube.rotation.y;
                    const endRotX = target.x + spinsX;
                    const endRotY = target.y + spinsY;

                    let startTime = null;
                    function animateCube(timestamp) {
                        if (!startTime) startTime = timestamp;
                        const progress = Math.min((timestamp - startTime) / 800, 1);
                        const ease = 1 - Math.pow(1 - progress, 3); // Out cubic easing

                        cube.rotation.x = startRotX + (endRotX - startRotX) * ease;
                        cube.rotation.y = startRotY + (endRotY - startRotY) * ease;

                        if (progress < 1) {
                            requestAnimationFrame(animateCube);
                        } else {
                            isAnimating = false;
                        }
                    }
                    requestAnimationFrame(animateCube);
                });

                lastRawResult = totalSum;
                setTimeout(() => {
                    updateScoreDisplay();
                    logHistory(`Hod #${rollCounter} [${results.join(', ')}]`, getFinalResult());
                }, 800);

            } else {
                // Coin flip logic
                const isHeads = Math.random() < 0.5;
                const coin = objects[0];

                const spins = (Math.floor(Math.random() * 3) + 4) * Math.PI;
                const targetRotX = isHeads ? spins : spins + Math.PI;

                const startRotX = coin.rotation.x;
                let startTime = null;

                function animateCoin(timestamp) {
                    if (!startTime) startTime = timestamp;
                    const progress = Math.min((timestamp - startTime) / 1000, 1);
                    const ease = 1 - Math.pow(1 - progress, 3);

                    coin.rotation.x = startRotX + (targetRotX - startRotX) * ease;
                    coin.position.y = Math.sin(progress * Math.PI) * 1.5; // Upward hop animation

                    if (progress < 1) {
                        requestAnimationFrame(animateCoin);
                    } else {
                        isAnimating = false;
                    }
                }
                requestAnimationFrame(animateCoin);

                setTimeout(() => {
                    const resultText = isHeads ? 'Hlava' : 'Orel';
                    document.getElementById('result-val').innerText = resultText;
                    document.getElementById('action-count').innerText = rollCounter;
                    logHistory(`Hodu #${rollCounter}`, resultText);
                }, 1000);
            }
        }

        function getFinalResult() {
            const mod = parseInt(document.getElementById('modifier').value, 10) || 0;
            return lastRawResult + mod;
        }

        function updateScoreDisplay() {
            if (currentGame === 'dice' && lastRawResult > 0) {
                document.getElementById('result-val').innerText = getFinalResult();
                document.getElementById('action-count').innerText = rollCounter;
            }
        }

        function logHistory(label, val) {
            const list = document.getElementById('history-list');
            const entry = document.createElement('div');
            entry.className = 'history-entry';
            entry.innerHTML = `<span>${label}</span><strong>${val}</strong>`;
            list.prepend(entry);
        }

        function switchGame(mode) {
            currentGame = mode;
            document.getElementById('tab-dice').classList.toggle('active', mode === 'dice');
            document.getElementById('tab-coin').classList.toggle('active', mode === 'coin');

            document.getElementById('dice-controls').style.display = mode === 'dice' ? 'grid' : 'none';
            document.getElementById('coin-controls').style.display = mode === 'coin' ? 'grid' : 'none';

            document.getElementById('action-btn').innerText = mode === 'dice' ? 'Hodit kostkou' : 'Hodit mincí';
            document.getElementById('result-val').innerText = '-';

            setup3DStage();
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = canvasStage.clientWidth / canvasStage.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(canvasStage.clientWidth, canvasStage.clientHeight);
        });

        initThree();
    </script>
</body>
</html>
