<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hrací kostka</title>
    <style>
        :root {
            --bg-color: #f4f5f7;
            --card-bg: #ffffff;
            --text-primary: #172b4d;
            --text-secondary: #6b778c;
            --border-color: #dfe1e6;
            --accent-color: #0052cc;
            --accent-hover: #0065ff;
            --dice-bg: #ffffff;
            --dice-border: #091e42;
            --pip-color: #091e42;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            width: 100%;
            max-width: 480px;
            padding: 32px;
            box-shadow: 0 4px 12px rgba(9, 30, 66, 0.08);
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        header {
            text-align: center;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        p.subtitle {
            font-size: 14px;
            color: var(--text-secondary);
        }

        /* Controls */
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
        }

        select {
            font-family: inherit;
            font-size: 14px;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: #fafbfc;
            color: var(--text-primary);
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s, background-color 0.2s;
        }

        select:hover {
            background-color: #f4f5f7;
        }

        select:focus {
            border-color: var(--accent-color);
        }

        /* Dice Display Area */
        .dice-area {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 24px;
            min-height: 120px;
            padding: 16px 0;
            perspective: 1000px;
        }

        /* 3D Cube */
        .scene {
            width: 80px;
            height: 80px;
            perspective: 400px;
        }

        .cube {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .cube-face {
            position: absolute;
            width: 80px;
            height: 80px;
            background: var(--dice-bg);
            border: 2px solid var(--dice-border);
            border-radius: 12px;
            display: grid;
            grid-template: repeat(3, 1fr) / repeat(3, 1fr);
            padding: 6px;
            box-sizing: border-box;
        }

        .pip {
            display: block;
            background-color: var(--pip-color);
            border-radius: 50%;
            align-self: center;
            justify-self: center;
            width: 12px;
            height: 12px;
        }

        /* 3D Face Rotations */
        .face-1 { transform: rotateY(0deg) translateZ(40px); }
        .face-2 { transform: rotateY(90deg) translateZ(40px); }
        .face-3 { transform: rotateX(-90deg) translateZ(40px); }
        .face-4 { transform: rotateX(90deg) translateZ(40px); }
        .face-5 { transform: rotateY(-90deg) translateZ(40px); }
        .face-6 { transform: rotateY(180deg) translateZ(40px); }

        /* Pip Positions */
        .pip:nth-child(1) { grid-area: 1 / 1; }
        .pip:nth-child(2) { grid-area: 1 / 3; }
        .pip:nth-child(3) { grid-area: 2 / 2; }
        .pip:nth-child(4) { grid-area: 3 / 1; }
        .pip:nth-child(5) { grid-area: 3 / 3; }
        .pip:nth-child(6) { grid-area: 2 / 1; }
        .pip:nth-child(7) { grid-area: 2 / 3; }

        /* Non-D6 Display */
        .poly-dice {
            width: 80px;
            height: 80px;
            background: var(--dice-bg);
            border: 2px solid var(--dice-border);
            color: var(--text-primary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 700;
            transition: transform 0.4s ease;
        }

        /* Primary Action Button */
        button.btn-roll {
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            border-radius: 6px;
            padding: 12px 20px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }

        button.btn-roll:hover {
            background-color: var(--accent-hover);
        }

        button.btn-roll:active {
            transform: translateY(1px);
        }

        /* Summary Output */
        .results-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            border-top: 1px solid var(--border-color);
            padding-top: 16px;
        }

        .result-card {
            background-color: #fafbfc;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            text-align: center;
        }

        .result-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .result-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Hrací kostka</h1>
            <p class="subtitle">Generátor náhodných hodu</p>
        </header>

        <div class="controls">
            <div class="control-group">
                <label for="dice-count">Počet kostek</label>
                <select id="dice-count" onchange="setupDice()">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                </select>
            </div>

            <div class="control-group">
                <label for="dice-type">Typ kostky</label>
                <select id="dice-type" onchange="setupDice()">
                    <option value="6">D6 (Klasická)</option>
                    <option value="4">D4</option>
                    <option value="8">D8</option>
                    <option value="10">D10</option>
                    <option value="12">D12</option>
                    <option value="20">D20</option>
                </select>
            </div>
        </div>

        <div id="dice-playground" class="dice-area"></div>

        <button class="btn-roll" onclick="rollAll()">Hodit kostkou</button>

        <div class="results-panel">
            <div class="result-card">
                <div id="total-sum" class="result-value">0</div>
                <div class="result-label">Součet</div>
            </div>
            <div class="result-card">
                <div id="roll-count" class="result-value">0</div>
                <div class="result-label">Celkem hodů</div>
            </div>
        </div>
    </div>

    <script>
        let rollCounter = 0;

        // Mathematical rotation mapping for 3D D6 faces
        const rotations = {
            1: { x: 0,   y: 0 },
            2: { x: 0,   y: -90 },
            3: { x: 90,  y: 0 },
            4: { x: -90, y: 0 },
            5: { x: 0,   y: 90 },
            6: { x: 0,   y: 180 }
        };

        function createCubeElement() {
            const scene = document.createElement('div');
            scene.className = 'scene';
            scene.innerHTML = `
                <div class="cube" data-x="0" data-y="0">
                    <div class="cube-face face-1"><span class="pip"></span></div>
                    <div class="cube-face face-2"><span class="pip"></span><span class="pip"></span></div>
                    <div class="cube-face face-3"><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
                    <div class="cube-face face-4"><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
                    <div class="cube-face face-5"><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
                    <div class="cube-face face-6"><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
                </div>
            `;
            return scene;
        }

        function setupDice() {
            const container = document.getElementById('dice-playground');
            const count = parseInt(document.getElementById('dice-count').value, 10);
            const type = parseInt(document.getElementById('dice-type').value, 10);

            container.innerHTML = '';

            for (let i = 0; i < count; i++) {
                if (type === 6) {
                    container.appendChild(createCubeElement());
                } else {
                    const poly = document.createElement('div');
                    poly.className = 'poly-dice';
                    poly.innerText = '-';
                    container.appendChild(poly);
                }
            }
        }

        function rollAll() {
            const type = parseInt(document.getElementById('dice-type').value, 10);
            const container = document.getElementById('dice-playground');
            let sum = 0;

            if (type === 6) {
                const cubes = container.querySelectorAll('.cube');
                cubes.forEach(cube => {
                    const value = Math.floor(Math.random() * 6) + 1;
                    sum += value;

                    let currentX = parseInt(cube.getAttribute('data-x'), 10) || 0;
                    let currentY = parseInt(cube.getAttribute('data-y'), 10) || 0;

                    const target = rotations[value];

                    // Add full 360-degree rotations to preserve smooth animation flow
                    let nextX = currentX + 720 + (target.x - (currentX % 360));
                    let nextY = currentY + 720 + (target.y - (currentY % 360));

                    cube.style.transform = `rotateX(${nextX}deg) rotateY(${nextY}deg)`;
                    cube.setAttribute('data-x', nextX);
                    cube.setAttribute('data-y', nextY);
                });
            } else {
                const polyDice = container.querySelectorAll('.poly-dice');
                polyDice.forEach(dice => {
                    const value = Math.floor(Math.random() * type) + 1;
                    sum += value;

                    dice.style.transform = 'scale(0.9)';
                    setTimeout(() => {
                        dice.innerText = value;
                        dice.style.transform = 'scale(1)';
                    }, 150);
                });
            }

            rollCounter++;
            document.getElementById('total-sum').innerText = sum;
            document.getElementById('roll-count').innerText = rollCounter;
        }

        // Initialize default view
        setupDice();
    </script>
</body>
</html>
